; =====================================================================
;  php/forja.ini · Directivas de TU entorno de desarrollo      [CE 2.f]
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo:  docker compose restart www
;
;  Formato:   directiva = valor     ; explicación
; =====================================================================


display_errors = On          ; Muestra errores en el navegador para detectar fallos durante el desarrollo.
error_reporting = E_ALL      ; Informa de todos los errores y avisos para poder corregirlos antes de entregar.
date.timezone = Europe/Madrid ; Usa la hora local correcta en funciones como date().
short_open_tag = On          ; Permite usar etiquetas PHP cortas si el código del ejercicio las necesita.
expose_php = Off             ; Oculta la versión de PHP en las cabeceras HTTP para reducir información expuesta.
log_errors = On              ; Guarda los errores en el registro de PHP como complemento a mostrarlos en desarrollo.
